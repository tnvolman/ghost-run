name: ghost-run
version: 0.2.0
requires_hermes: ">=0.21.7"
description: >
  Dry-run mode for Hermes Agent. While Ghost Mode is on, file writes/edits/deletes
  and terminal tools are redirected into a throwaway copy of the working folder;
  network-touching tools and commands are blocked.   Review the diff, then apply
  selected paths or discard. The real folder changes only after a person presses Apply or runs `/ghost apply`. Optional thin Verify runs one configured test in
  the ghost copy only after you approve that project (advisory; Apply stays human).
  Opt-in outbound: set GHOST_RUN_AI=1 for advisory notes. Inside Hermes those
  notes use ctx.llm.complete (your provider; the plugin never sees the key).
  Outside that call, OPENROUTER_API_KEY is read only via agent.secret_scope.
  If that module is missing, notes stay off. The main model key is never sent.
  Off by default; nothing is uploaded otherwise.
  Slash: /ghost on|off|status.
  CLI: hermes ghost diff|verify|apply|discard|ui.
author: "Michael McClanahan (@tnvolman)"
kind: standalone
license: MIT
homepage: "https://github.com/tnvolman/ghost-run"
tags:
  - safety
  - dry-run
  - sandbox
  - diff
provides_hooks:
  - pre_tool_call
provides_middleware:
  - tool_request
# Declared registrations must match register() exactly (catalog admission).
# Slash + CLI commands are registered at runtime; listed here for humans and
# newer Hermes validators that probe command registration.
provides_commands:
  - ghost
provides_cli_commands:
  - ghost
known_issues:
  - "Verified on macOS in Hermes Desktop v0.23.1 at 54badf24: the pane opens the review page in the system browser; Load, Apply, and the HIGH confirm run on that page, not inside the pane. Checklist: docs/desktop-check.md."
  - "Advisory OpenRouter notes run only when ctx.llm is unbound and agent.secret_scope.get_secret returns OPENROUTER_API_KEY. Otherwise the notes stay off."
  - "Checked on Linux and macOS (Hermes Desktop v0.23.1 at 54badf24). Windows is untested."
  - "The demo's headless Chrome fallback puts the review URL, fragment token included, on the browser process command line. curl reads the token from a mode-600 header file that is removed afterwards."
